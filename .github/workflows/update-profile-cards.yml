# Đặt tại: .github/workflows/update-profile-cards.yml (repo anhkhoa-ledinh/anhkhoa-ledinh)
# Mỗi ngày: lấy dữ liệu contribution thật, vẽ lại biểu đồ trong README, cập nhật dữ liệu cho trang biển sao,
# vẽ lại thẻ thống kê, rồi gộp tất cả vào một commit duy nhất để repo không phình to.

name: Update profile cards

on:
  schedule:
    - cron: "0 17 * * *" # 0h sáng giờ Việt Nam
  workflow_dispatch: # cho phép bấm "Run workflow" trong tab Actions
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Contribution graph + star-sea data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/contributions.py "${{ github.repository_owner }}"

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide_border=true&theme=transparent
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&theme=transparent
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit (one rolling commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile docs/contributions.json
          if git diff --cached --quiet; then exit 0; fi
          if [ "$(git log -1 --pretty=%an)" = "github-actions[bot]" ] && [ "$(git log -1 --pretty=%s)" = "Update profile cards" ]; then
            git commit --amend --no-edit
            git push --force-with-lease
          else
            git commit -m "Update profile cards"
            git push
          fi
